name: Android TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python bağımlılıkları (nanopb)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          pip install protobuf grpcio-tools

      - name: NDK ve CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" "cmake;3.22.1" > /dev/null

      - uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: APK adını düzelt
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OyunCeviri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: oyun-ceviri-apk
          path: OyunCeviri.apk

      - name: Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Oyun Çeviri build ${{ github.run_number }}
          make_latest: true
          files: OyunCeviri.apk
